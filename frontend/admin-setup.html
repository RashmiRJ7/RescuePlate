<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Secure one-time initial RescuePlate administrator setup.">
  <title>Initial Admin Setup | RescuePlate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="mr-entrance">
  <main class="container py-5" style="max-width: 42rem;">
    <a class="mr-brand mb-4" href="index.html">
      <span class="mr-logo" aria-hidden="true"><i class="bi bi-basket2-fill"></i></span>
      RescuePlate
    </a>
    <section class="dashboard-card p-4 p-md-5" aria-labelledby="setup-title">
      <p class="mr-kicker"><i class="bi bi-shield-lock" aria-hidden="true"></i> Secure first-time setup</p>
      <h1 class="display-6" id="setup-title">Create the first administrator</h1>
      <p class="text-body-secondary">This one-time setup is available only when no administrator exists and a setup key has been configured by the operator.</p>
      <div id="setup-unavailable" class="alert alert-info" role="status" hidden></div>
      <form id="admin-setup-form" novalidate hidden>
        <div class="mb-3">
          <label class="form-label" for="admin-name">Full name</label>
          <input class="form-control" id="admin-name" name="name" autocomplete="name" maxlength="100" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="admin-email">Email</label>
          <input class="form-control" id="admin-email" name="email" type="email" autocomplete="email" maxlength="150" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="admin-phone">Phone (optional)</label>
          <input class="form-control" id="admin-phone" name="phone" type="tel" autocomplete="tel" maxlength="20">
        </div>
        <div class="mb-3">
          <label class="form-label" for="admin-password">Password</label>
          <input class="form-control" id="admin-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
          <div class="form-text">Use at least 12 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="admin-confirm-password">Confirm password</label>
          <input class="form-control" id="admin-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="admin-setup-key">One-time setup key</label>
          <input class="form-control" id="admin-setup-key" name="setupKey" type="password" autocomplete="off" required>
        </div>
        <button class="btn mr-btn mr-btn-primary" type="submit">Create administrator</button>
      </form>
      <p class="mt-3 mb-0" id="setup-feedback" aria-live="polite"></p>
      <p class="mt-4 mb-0"><a href="login.html">Return to sign in</a></p>
    </section>
  </main>
  <script src="js/admin-setup.js"></script>
</body>
</html>
