<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RescuePlate | Surplus Food Rescue</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">

<body class="d-flex flex-column min-vh-100">
    <!-- Shared navbar is rendered here by js/layout.js -->

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <h1 class="display-6 fw-semibold mb-3">Time-Sensitive Surplus Food Rescue</h1>

                    <div class="card-body">
                        <h2 class="h6 text-uppercase text-body-secondary mb-2">Backend status</h2>
                        <p id="health-status" class="mb-0">Checking&hellip;</p>
                    </div>
                </div>
                <p class="small text-body-secondary mt-4">Project scaffold. Features are added task by task (see docs/TASKS.md).</p>
            </div>
        </div>
    </main>

    <!-- Shared footer is rendered here by js/layout.js -->
    <footer id="app-footer"></footer>

    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
