spring.application.name=rescueplate

# Optional local .env file in the working directory (git-ignored). See .env.example.
# Real environment variables override values from this file.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ---- Database (MySQL 8) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_rescue?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# update: Hibernate creates/updates tables from entities (TASKS.md F2). No entities exist yet.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
# All timestamps stored in UTC (ARCHITECTURE.md §9)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- JSON ----
# ISO-8601 UTC timestamps in the API (API_DOCUMENTATION.md §1)
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- One-time Initial Admin Setup ----
app.admin.setup-key=${ADMIN_SETUP_KEY:}

